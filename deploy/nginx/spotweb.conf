# /etc/nginx/sites-available/spotweb.conf  (TLS via certbot --nginx)

# API requests per client: 1 per second on average, bursts of up to 60 are served at once (a page
# view makes a few, Home Assistant polls about every 3 minutes). Over that nginx answers 429.
limit_req_zone $binary_remote_addr zone=spotweb_api:10m rate=60r/m;

server {
    listen 80;
    listen [::]:80;
    server_name spot.example.com;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;

    location / {
        proxy_pass http://127.0.0.1:6000;
    }

    location /api/ {
        limit_req zone=spotweb_api burst=60 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:6000;
    }
}
