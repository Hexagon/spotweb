services:
  spotweb:
    # Signed release image (see docs/deployment.md); pin a version such as :2.7.2 in production.
    # `docker compose up -d --build` builds from the Dockerfile instead.
    image: ghcr.io/hexagon/spotweb:latest
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:6000:6000"
    environment:
      API_TOKEN: ${API_TOKEN}
      # SPOTWEB_PUBLIC_URL: https://spot.example.com
    volumes:
      - spotweb-data:/data
volumes:
  spotweb-data:
