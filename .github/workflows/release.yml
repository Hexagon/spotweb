# Builds static release binaries for all platforms, signs them with Sigstore
# (keyless, GitHub OIDC) and publishes a GitHub release with SLSA build
# provenance attestations, plus a signed multi-arch image in ghcr.io.
# Triggered by pushing a tag like `v2.0.0`.
name: Release

on:
  push:
    tags: ["v[0-9]*"]   # v2.0.0, not v1-final
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)build, e.g. v2.0.0"
        required: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  build:
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-musl, os: ubuntu-24.04, musl: true }
          - { target: aarch64-unknown-linux-musl, os: ubuntu-24.04-arm, musl: true }
          - { target: aarch64-apple-darwin, os: macos-latest }
          - { target: x86_64-apple-darwin, os: macos-latest }  # cross-compiled on Apple silicon
          - { target: x86_64-pc-windows-msvc, os: windows-latest }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - name: Install musl tools
        if: matrix.musl
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Build
        shell: bash
        run: |
          if [ "${{ matrix.musl }}" = "true" ]; then
            export CC="musl-gcc"
          fi
          cargo build --release --locked --target ${{ matrix.target }}
      - name: Test (native targets)
        if: "!contains(matrix.target, 'x86_64-apple')"
        shell: bash
        run: |
          if [ "${{ matrix.musl }}" = "true" ]; then
            export CC="musl-gcc"
          fi
          cargo test --release --locked --target ${{ matrix.target }}
      - name: Package
        shell: bash
        run: |
          name="spotweb-${TAG}-${{ matrix.target }}"
          mkdir -p "dist/$name"
          bin=target/${{ matrix.target }}/release/spotweb
          [ -f "$bin.exe" ] && bin="$bin.exe"
          cp "$bin" README.md LICENSE "dist/$name/"
          cp -r deploy "dist/$name/"
          cd dist
          if [[ "${{ matrix.target }}" == *windows* ]]; then
            7z a "$name.zip" "$name" > /dev/null
          else
            tar czf "$name.tar.gz" "$name"
          fi
          rm -rf "$name"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write      # create the release
      id-token: write      # Sigstore keyless signing + attestations
      attestations: write  # build provenance
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: sha256sum spotweb-* > SHA256SUMS && cat SHA256SUMS
      - uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3.9.1
      - name: Sign (Sigstore keyless)
        working-directory: dist
        run: |
          for f in spotweb-* SHA256SUMS; do
            cosign sign-blob --yes --bundle "$f.sigstore.json" "$f"
          done
      - name: Build provenance attestation
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: "dist/spotweb-*"
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          repo="${{ github.repository }}"
          # The release may already exist (created in the GitHub UI); then attach the files
          # and fill in auto-generated release notes if the body was left empty
          if gh release view "$TAG" --repo "$repo" > /dev/null 2>&1; then
            gh release upload "$TAG" dist/* --repo "$repo" --clobber
            body=$(gh release view "$TAG" --repo "$repo" --json body --jq .body)
            if [ -z "$(echo "$body" | tr -d '[:space:]')" ]; then
              gh api "repos/$repo/releases/generate-notes" -f tag_name="$TAG" --jq .body > notes.md
              gh release edit "$TAG" --repo "$repo" --notes-file notes.md
            fi
          else
            gh release create "$TAG" dist/* \
              --repo "${{ github.repository }}" \
              --title "spotweb $TAG" \
              --generate-notes \
              --verify-tag
          fi

  # Multi-arch image in GHCR with the release's own musl binaries (Dockerfile, BIN=prebuilt), so the image
  # runs exactly the files that were signed above. Signed with cosign (keyless) and given build provenance.
  docker:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write      # push to ghcr.io
      id-token: write      # Sigstore keyless signing + attestations
      attestations: write  # build provenance
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: "*-unknown-linux-musl"
          path: artifacts
          merge-multiple: true
      - name: Unpack binaries
        run: |
          for pair in amd64:x86_64 arm64:aarch64; do
            arch=${pair%%:*}
            name="spotweb-${TAG}-${pair#*:}-unknown-linux-musl"
            tar xzf "artifacts/$name.tar.gz" -C artifacts
            mkdir -p "dist/$arch"
            cp "artifacts/$name/spotweb" "dist/$arch/spotweb"
          done
          ls -l dist/*/spotweb
          # Image names must be lowercase (Hexagon/spotweb -> ghcr.io/hexagon/spotweb)
          echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          # 2.3.0, 2.3 and latest; pre-releases (v3.0.0-rc.1) get only their own version
          tags: |
            type=semver,pattern={{version}},value=${{ env.TAG }}
            type=semver,pattern={{major}}.{{minor}},value=${{ env.TAG }}
            type=raw,value=latest,enable=${{ !contains(env.TAG, '-') }}
      - id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          build-args: BIN=prebuilt
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
      - uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3.9.1
      - name: Sign image (Sigstore keyless)
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: cosign sign --yes "$IMAGE@$DIGEST"
      - name: Build provenance attestation
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
