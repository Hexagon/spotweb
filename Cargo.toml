[package]
name = "spotweb"
version = "2.9.0"
edition = "2021"
description = "Electricity spot prices, production and consumption from ENTSO-e - single binary server"
license = "MIT"
repository = "https://github.com/Hexagon/spotweb"
readme = "README.md"

[dependencies]
anyhow = "1"
axum = { version = "0.8", default-features = false, features = ["http1", "http2", "tokio", "query", "json", "matched-path"] }
jiff = { version = "0.2", features = ["tzdb-bundle-always"] }
clap = { version = "4", features = ["derive", "env"] }
minijinja = { version = "2", features = ["loader", "json"] }
parking_lot = "0.13"
quick-xml = "0.42"
r2d2 = "0.8"
r2d2_sqlite = "0.37"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "gzip"] }
rusqlite = { version = "0.42", features = ["bundled", "backup"] }
rust-embed = { version = "8", features = ["mime-guess"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "time", "sync", "net"] }
tower-http = { version = "0.7", features = ["catch-panic", "compression-gzip", "compression-br", "trace", "timeout"] }
tracing = "0.1"
uuid = { version = "1", features = ["v4"] }
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
zip = { version = "9", default-features = false, features = ["deflate"] }
zstd = { version = "0.14", features = ["zstdmt", "experimental"] }

# musl's malloc is slow with many threads, so the static Linux builds (release archives and Docker) use mimalloc
[target.'cfg(target_env = "musl")'.dependencies]
mimalloc = { version = "0.1", default-features = false }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
# A panic in one request or job is caught (500 / failed run) instead of killing the process
panic = "unwind"
