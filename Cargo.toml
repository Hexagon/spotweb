[package]
name = "spotweb"
version = "2.0.2"
edition = "2021"
description = "Electricity spot prices, production and consumption from ENTSO-e - single binary server"
license = "MIT"
repository = "https://github.com/Hexagon/spotweb"
readme = "README.md"

[dependencies]
anyhow = "1"
axum = { version = "0.8", default-features = false, features = ["http1", "http2", "tokio", "query", "json", "matched-path"] }
chrono = { version = "0.4", default-features = false, features = ["std", "clock", "serde"] }
chrono-tz = "0.10"
clap = { version = "4", features = ["derive", "env"] }
minijinja = { version = "2", features = ["loader", "json"] }
parking_lot = "0.12"
quick-xml = "0.42"
r2d2 = "0.8"
r2d2_sqlite = "0.37"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "gzip"] }
rusqlite = { version = "0.42", features = ["bundled", "backup"] }
rust-embed = { version = "8", features = ["mime-guess"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "time", "sync", "net"] }
tokio-cron-scheduler = { version = "0.15", features = ["signal"] }
tower-http = { version = "0.6", features = ["compression-gzip", "compression-br", "trace", "timeout"] }
tracing = "0.1"
uuid = "1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
zip = { version = "9", default-features = false, features = ["deflate"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
